name: Build Android APK

on:
  push:
    branches: [main, master]
    paths:
      - index.html
      - guide.html
      - guide/**
      - icon-*.png
      - capacitor.config.json
      - google-services.json
      - package.json
      - package-lock.json
      - scripts/**
      - .github/workflows/build-apk.yml
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the APK as a GitHub Release asset

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Add KEYSTORE_BASE64, KEYSTORE_PASSWORD and KEY_ALIAS in Settings > Secrets and variables > Actions (see APK-SETUP.md)"
            exit 1
          fi

      - run: npm ci

      - name: Web build (same index.html, offline bundle)
        run: node scripts/build-native.mjs

      - name: Create Android project
        run: |
          npx cap add android
          node scripts/prepare-android.mjs
          npx cap sync android

      - name: Build release APK
        working-directory: android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/budget.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/budget.jks" --ks-key-alias "${KEY_ALIAS:-budget}" \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS --out budget-planner.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs budget-planner.apk | tee cert.txt
          echo "### APK signing certificate" >> "$GITHUB_STEP_SUMMARY"
          grep -i "SHA-1\|SHA-256" cert.txt | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
          rm -f "$RUNNER_TEMP/budget.jks"

      - name: Zip web bundle for live updates
        run: cd dist && zip -qr ../web-bundle.zip .

      - name: Publish to GitHub Release (tag "apk")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apk >/dev/null 2>&1 || gh release create apk --title "Budget Planner (Android)" --notes "Latest Android build" --latest=false
          gh release upload apk budget-planner.apk web-bundle.zip --clobber
          # notes are edited LAST: the app only sees a new build once both files are uploaded
          SUM=$(sha256sum web-bundle.zip | cut -d' ' -f1)
          gh release edit apk --notes "Build #${{ github.run_number }} - ${GITHUB_SHA::7} - sha256:$SUM"
          echo "APK: https://github.com/${{ github.repository }}/releases/download/apk/budget-planner.apk" >> "$GITHUB_STEP_SUMMARY"
